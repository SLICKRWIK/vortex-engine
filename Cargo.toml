[package]
name = "vortex-engine"
version = "0.1.0"
edition = "2021"
description = "Ultra-Low Latency Level-2 Order Book & Market Microstructure Analytics Engine in Rust"
authors = ["Quantitative Engineering Specialist"]
license = "MIT"

[dependencies]
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
hdrhistogram = "7.5"
crossterm = "0.28"
ctrlc = "3.4"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "time"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "orderbook_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
